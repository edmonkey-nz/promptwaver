<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PromptWaver — Output</title>
<link rel="icon" type="image/svg+xml" href="/static/promptwaver.svg">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
            cursor:none}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;left:0;right:0;bottom:24px;text-align:center;
        font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#5a5f6b;
        opacity:1;transition:opacity 1.5s ease-out;pointer-events:none;user-select:none}
  #hint.gone{opacity:0}
  #status{position:fixed;left:0;right:0;top:24px;text-align:center;
          font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#a04040;
          display:none;pointer-events:none;user-select:none}
  #status.show{display:block}
  #title{position:fixed;bottom:24px;left:24px;font:14px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#e7eaf0;
        opacity:0;transition:opacity 0.5s ease-in-out;pointer-events:none;user-select:none}
  #title.show{opacity:1}
  /* Frame-rate meter. Top-left rather than centred so it never sits over the
     middle of a projection, and deliberately dim — it's a diagnostic you
     glance at while tuning, not part of the show. */
  #fps{position:fixed;top:10px;left:12px;font:12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
       color:#5a5f6b;display:none;pointer-events:none;user-select:none;white-space:pre}
  #fps.show{display:block}
  #fps b{color:#33e0d0;font-weight:normal}
  #fps .warn{color:#f2a623}
</style>
</head>
<body>
<canvas id="out"></canvas>
<div id="hint">PromptWaver output — drag this window to your projector/second screen, then press F11 for fullscreen</div>
<div id="status">disconnected — retrying…</div>
<div id="title"></div>
<div id="fps"></div>
<script>
const cv = document.getElementById("out"), cx = cv.getContext("2d");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");

function resize(){
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(window.innerWidth * dpr);
  cv.height = Math.round(window.innerHeight * dpr);
}
window.addEventListener("resize", resize);
resize();

setTimeout(() => hintEl.classList.add("gone"), 4000);

const outputId = new URLSearchParams(location.search).get("out") || "1";
document.title = `PromptWaver — Output ${outputId}`;
hintEl.textContent = `PromptWaver output ${outputId} — drag this window to your projector/second screen, then press F11 for fullscreen`;

// Monitor-only visual filters — pure canvas rendering, no effect on the
// vector data sent to the laser DAC. glow/trail/mirror are per-scene now
// (saved via Save Camera settings / Save all scene settings on the main
// control page, loaded with whatever scene is live) — read straight off
// this window's own copy of the same state broadcast the control page
// gets, not localStorage, since the engine is the source of truth for
// them now. flip is different: a per-OUTPUT-MONITOR physical-orientation
// setting (Settings > Output monitors on the control page), keyed by this
// window's own `?out=` id, that has nothing to do with the scene — that
// one still lives in localStorage + the "storage" event, since it's not
// engine state at all.
const filters = {
  glow: 0, trail: 0, mirrorX: false, mirrorY: false,
  // Post-processing effects
  kaleidoscopeSegments: 0,  // 0=off, 3-12=number of radial segments
  // Output viewport ratio (Settings > Output), width/height. Comes from the
  // engine rather than this window's own shape: normalised -1..1 space now
  // represents a viewport of THIS ratio, so the letterbox below has to fit
  // that shape into the window instead of assuming a square.
  aspect: 1,
  flipX: localStorage.getItem(`pw_filter_flipx_${outputId}`) === "1",
  flipY: localStorage.getItem(`pw_filter_flipy_${outputId}`) === "1",
  // This window's OWN keystone (Settings > Output monitors) — independent
  // of the laser's (which lives server-side, engine-tracked) and of the
  // other output window's. Display-only: never sent anywhere.
  keystoneH: parseFloat(localStorage.getItem(`pw_filter_keystoneh_${outputId}`) || "0"),
  keystoneV: parseFloat(localStorage.getItem(`pw_filter_keystonev_${outputId}`) || "0"),
};
// NOT keyed by outputId, unlike flip/keystone above: those describe how one
// physical screen is mounted, so they differ per window. This is a diagnostic
// overlay you turn on to measure a problem and off again, and wanting it on
// one output but not the other isn't a real case — one switch drives both.
let showFps = localStorage.getItem("pw_output_fps") === "1";
window.addEventListener("storage", e => {
  if (e.key === `pw_filter_flipx_${outputId}`) filters.flipX = e.newValue === "1";
  if (e.key === `pw_filter_flipy_${outputId}`) filters.flipY = e.newValue === "1";
  if (e.key === `pw_filter_keystoneh_${outputId}`) filters.keystoneH = parseFloat(e.newValue || "0");
  if (e.key === `pw_filter_keystonev_${outputId}`) filters.keystoneV = parseFloat(e.newValue || "0");
  if (e.key === "pw_output_fps") setFpsVisible(e.newValue === "1");
});

// Same bilinear formula as output/ilda.py's PathPlanner._to_dac_vec and
// index.html's matching applyKeystone — kept in sync so this is a faithful
// stand-in for what a real keystone-corrected screen would show.
function applyKeystone(x, y, kh, kv){
  const xk = x * (1 + kh * y);
  const yk = y * (1 + kv * xk);
  return [Math.max(-1, Math.min(1, xk)), Math.max(-1, Math.min(1, yk))];
}

// Reflects one half of the canvas over the centre line onto the other half
// (kaleidoscope-style) — the shared "mirror" effect (Global section).
function applyMirror(ctx, canvas, mirrorX, mirrorY){
  const w = canvas.width, h = canvas.height;
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "source-over";
  if (mirrorX){
    ctx.save();
    ctx.translate(w, 0); ctx.scale(-1, 1);
    ctx.drawImage(canvas, 0, 0, w/2, h, 0, 0, w/2, h);
    ctx.restore();
  }
  if (mirrorY){
    ctx.save();
    ctx.translate(0, h); ctx.scale(1, -1);
    ctx.drawImage(canvas, 0, 0, w, h/2, 0, 0, w, h/2);
    ctx.restore();
  }
}

// Reverses the WHOLE image, no reflection — the per-output-monitor "flip"
// (Settings > Output monitors). Distinct from applyMirror above: this
// never creates symmetry, it just runs the finished frame through a
// physical-orientation correction for this specific screen.
function applyFlip(ctx, canvas, flipX, flipY){
  const w = canvas.width, h = canvas.height;
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "source-over";
  ctx.translate(flipX ? w : 0, flipY ? h : 0);
  ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(canvas, 0, 0, w, h);
  ctx.restore();
}

// Kaleidoscope: wedge-based radial symmetry with alternating mirrors
function applyKaleidoscope(ctx, canvas, segments){
  if (segments < 3) return;
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const radius = Math.sqrt(cx * cx + cy * cy) * 1.5;

  ctx.save();
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "source-over";

  const angleStep = (Math.PI * 2) / segments;
  for (let i = 0; i < segments; i++) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angleStep * i);

    // Create a triangular clipping region (wedge/pie slice)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(radius * Math.cos(0), radius * Math.sin(0));
    ctx.arc(0, 0, radius, 0, angleStep, false);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.clip();

    // Alternate between normal and horizontally-flipped versions
    if (i % 2 === 1) {
      ctx.scale(-1, 1);
    }

    ctx.translate(-cx, -cy);
    ctx.drawImage(canvas, 0, 0, w, h);
    ctx.restore();
  }
  ctx.restore();
}

function paint(scene){
  const w = cv.width, h = cv.height;
  cx.shadowBlur = 0;   // never let a glow from the previous frame bleed into the clear/fade below
  cx.globalCompositeOperation = "source-over";
  cx.fillStyle = filters.trail > 0 ? `rgba(0,0,0,${(1 - filters.trail).toFixed(3)})` : "#000";
  cx.fillRect(0, 0, w, h);
  if (!scene || !scene.length) return;
  // Fit the -1..1 viewport into the window letterboxed, never stretched — but
  // the viewport is `filters.aspect` wide per unit tall, not necessarily
  // square, so scale x and y separately. Set the ratio to match the screen and
  // the bars disappear; leave it at 1:1 on a widescreen and you get pillarbox,
  // which is correct rather than a bug.
  const a = filters.aspect || 1;
  let sx = w * 0.5, sy = sx / a;
  if (sy > h * 0.5) { sy = h * 0.5; sx = sy * a; }
  const cx0 = w / 2, cy0 = h / 2;
  const map = (x, y) => {
    const [xk, yk] = applyKeystone(x, y, filters.keystoneH, filters.keystoneV);
    return [cx0 + xk * sx, cy0 - yk * sy];
  };
  cx.lineWidth = Math.max(1, Math.min(sx, sy) / 260);
  cx.lineJoin = "round";
  // Single shadowBlur pass — see index.html's matching comment: a multi-pass
  // additive version (stroking 2-3x per stroke with shadowBlur set) made the
  // whole preview unusably slow, since shadowBlur is one of the more
  // expensive canvas 2D ops per call.
  // Per-stroke glow (st.g) floored by the scene's global glow — kept
  // identical to index.html's paintPreview so the projector and the in-page
  // preview never disagree about what a scene looks like.
  const unit = Math.min(w, h) * 0.05;
  let curBlur = -1;
  for (const st of scene) {
    const [r, g, b] = st.c;
    const col = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
    cx.strokeStyle = col;
    const px = Math.round(Math.max(filters.glow, st.g || 0) * unit);
    const blurCap = Math.min(16, px);  // cap at 16px — diminishing returns beyond this at HD+
    if (blurCap !== curBlur) { cx.shadowBlur = blurCap; curBlur = blurCap; }
    if (px > 0) cx.shadowColor = col;
    cx.beginPath();
    st.p.forEach((pt, i) => { const [X, Y] = map(pt[0], pt[1]); i ? cx.lineTo(X, Y) : cx.moveTo(X, Y); });
    cx.stroke();
  }
  cx.shadowBlur = 0;
  if (filters.kaleidoscopeSegments > 2) applyKaleidoscope(cx, cv, Math.round(filters.kaleidoscopeSegments));
  if (filters.mirrorX || filters.mirrorY) applyMirror(cx, cv, filters.mirrorX, filters.mirrorY);
  if (filters.flipX || filters.flipY) applyFlip(cx, cv, filters.flipX, filters.flipY);
}

// --- frame-rate meter -------------------------------------------------------
//
// Measures the REAL paint rate of THIS window, which is none of the numbers
// already on the control page: not the engine's render fps, and not the ~20Hz
// state broadcast either. `paint()` runs synchronously inside ws.onmessage,
// so once a full-HD canvas costs more to draw than the gap between messages,
// this is the only place that shows up.
//
// Paint cost in ms is reported next to it deliberately — "12 fps" alone
// doesn't tell you whether the fix is fewer strokes, less glow, or a smaller
// window, whereas "12 fps · 68ms · 210 strokes" points straight at it. 20 fps
// is the ceiling by design (the broadcast rate), so the meter compares against
// that rather than 60 and only warns when paint cost is genuinely the limit.
const fpsEl = document.getElementById("fps");
let _frames = 0, _paintMs = 0, _paintMax = 0, _strokes = 0, _lastFpsT = performance.now();

function setFpsVisible(on){
  showFps = !!on;
  fpsEl.classList.toggle("show", showFps);
  if (!showFps) return;
  _frames = 0; _paintMs = 0; _paintMax = 0; _lastFpsT = performance.now();
  fpsEl.textContent = "measuring…";
}
setFpsVisible(showFps);

function updateFpsReadout(){
  if (!showFps) return;
  const now = performance.now(), dt = now - _lastFpsT;
  if (dt < 500) return;                      // ~2 updates/sec; the overlay
  const fps = _frames * 1000 / dt;           // must not itself cost anything
  const avg = _frames ? _paintMs / _frames : 0;
  // The broadcast is ~20Hz, so anything at/near 20 is healthy and a low
  // number only means trouble if painting is actually slow — a paused engine
  // sends nothing and would otherwise read as 0fps "bad".
  const slow = avg > 25;
  fpsEl.innerHTML =
    `<b${slow ? ' class="warn"' : ''}>${fps.toFixed(1)} fps</b>  `
    + `<span${slow ? ' class="warn"' : ''}>paint ${avg.toFixed(1)}ms (max ${_paintMax.toFixed(1)})</span>  `
    + `${_strokes} strokes  ${cv.width}x${cv.height}`;
  _frames = 0; _paintMs = 0; _paintMax = 0; _lastFpsT = now;
}
setInterval(updateFpsReadout, 500);

const titleEl = document.getElementById("title");
let titleTimeout = null;

let ws = null;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws?hq=1`);
  ws.onopen = () => statusEl.classList.remove("show");
  ws.onclose = () => { statusEl.classList.add("show"); setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "state") {
      const s = m.state || {};
      filters.glow = s.glow ?? 0;
      filters.trail = s.trail ?? 0;
      filters.mirrorX = !!s.mirror_x;
      filters.mirrorY = !!s.mirror_y;
      filters.kaleidoscopeSegments = s.kaleidoscope_segments ?? 0;
      filters.aspect = s.output_aspect || 1;
      if (showFps) {
        // Timed around the real thing, filters and all — a number that
        // excluded the glow/mirror/keystone passes would miss the usual cause.
        const t0 = performance.now();
        paint(m.preview);
        const ms = performance.now() - t0;
        _frames++; _paintMs += ms;
        if (ms > _paintMax) _paintMax = ms;
        _strokes = (m.preview || []).length;
      } else {
        paint(m.preview);
      }
    } else if (m.type === "show_title") {
      clearTimeout(titleTimeout);
      titleEl.textContent = m.title;
      titleEl.classList.add("show");
      titleTimeout = setTimeout(() => {
        titleEl.classList.remove("show");
      }, 10000);
    }
  };
}
connect();
</script>
</body>
</html>
