name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: promptwaver
            asset_name: promptwaver-linux-x86_64
            python-version: '3.11'
          - os: macos-latest
            artifact_name: promptwaver
            asset_name: promptwaver-macos-arm64
            python-version: '3.11'
          - os: windows-latest
            artifact_name: promptwaver.exe
            asset_name: promptwaver-windows-x86_64.exe
            python-version: '3.11'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller anthropic
          pip install sounddevice || echo "sounddevice skipped"
          pip install pyo || echo "pyo skipped"

      - name: Verify PyInstaller
        run: pyinstaller --version

      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --name promptwaver --collect-all aiohttp --collect-all numpy --hidden-import=anthropic run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    # Creating a release WRITES to the repo, and the default GITHUB_TOKEN is
    # read-only unless the repo says otherwise. Without this the three builds
    # all succeed, their executables upload as artifacts, and only this last
    # job fails with a 403 — which is why every tag from v0.70.0 to v0.78.2
    # produced working binaries and no release to attach them to.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          body: |
            ## PromptWaver ${{ github.ref_name }}

            The browser UI is on by default at <http://localhost:8080>; `--headless`
            turns it off. (There is no `--web` flag — earlier notes here said there
            was, and passing it makes the app exit with an argparse error.)

            **Requires Chrome**, or another Chromium browser, with hardware
            acceleration on. The visuals render with WebGL2 and there is no Canvas2D
            fallback; on an unsupported browser the page says so instead of drawing.

            ### Downloads
            - **Linux**: `promptwaver-linux-x86_64`
            - **macOS**: `promptwaver-macos-arm64`
            - **Windows**: `promptwaver-windows-x86_64.exe`

            Run with:
            ```bash
            chmod +x promptwaver          # Linux/macOS, first run only
            ./promptwaver
            # different port, no audio:
            ./promptwaver --web-port 8097 --no-audio
            # with Helios laser hardware:
            ./promptwaver --laser --pps 11000
            # no browser UI:
            ./promptwaver --headless
            ```

            Generating new scenes needs an Anthropic API key (Settings > API, or
            `ANTHROPIC_API_KEY`). Without one the app still runs and plays the
            bundled scene library using the offline fallback director.

            See [CHANGELOG.md](CHANGELOG.md) for what changed, and
            [README.md](README.md) for full usage.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
