<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cyan to Violet Gradient from Reference Image 1 -->
    <linearGradient id="promptGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#3A7BD5" />
      <stop offset="100%" stop-color="#8A2387" />
    </linearGradient>

    <!-- Glowing Vector Filter -->
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Mode Rounded Container -->
  <rect width="128" height="128" rx="28" fill="#0B0D14" />

  <g filter="url(#vectorGlow)">
    
    <!-- 1. ELEVATED LOW-POLY MESH (Top Section) -->
    <polygon points="22,38 36,24 52,29 64,18 76,29 92,24 106,38" fill="none" stroke="url(#promptGradient)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 22 38 L 38 49 L 52 29 L 64 49 L 76 29 L 90 49 L 106 38" fill="none" stroke="url(#promptGradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 36 24 L 38 49 L 64 49 L 90 49 L 92 24" fill="none" stroke="url(#promptGradient)" stroke-width="1.4" opacity="0.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 22 38 L 28 60 L 38 49 L 64 66 L 90 49 L 100 60 L 106 38" fill="none" stroke="url(#promptGradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 28 60 L 64 66 L 100 60" fill="none" stroke="url(#promptGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 2. 5 SHORTER VERTICAL BLUE TRACK LINES (Gap below mesh starting at y=76) -->
    <line x1="24" y1="76" x2="24" y2="116" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="44" y1="76" x2="44" y2="116" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="64" y1="76" x2="64" y2="116" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="84" y1="76" x2="84" y2="116" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="104" y1="76" x2="104" y2="116" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />

    <!-- 3. RECTANGULAR SLIDER KNOBS ON BLUE TRACKS -->
    <rect x="19" y="98" width="10" height="5" rx="1" fill="#0B0D14" stroke="#00D2FF" stroke-width="1.8" />
    <rect x="39" y="84" width="10" height="5" rx="1" fill="#0B0D14" stroke="#00D2FF" stroke-width="1.8" />
    <rect x="59" y="104" width="10" height="5" rx="1" fill="#0B0D14" stroke="#00D2FF" stroke-width="1.8" />
    <rect x="79" y="90" width="10" height="5" rx="1" fill="#0B0D14" stroke="#00D2FF" stroke-width="1.8" />
    <rect x="99" y="108" width="10" height="5" rx="1" fill="#0B0D14" stroke="#00D2FF" stroke-width="1.8" />

    <!-- Accent Mesh Nodes -->
    <circle cx="64" cy="18" r="2" fill="url(#promptGradient)" />
    <circle cx="64" cy="49" r="2" fill="url(#promptGradient)" />
  </g>
</svg>
